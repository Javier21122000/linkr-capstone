spring.application.name=linkr

# PostgreSQL (valori letti dalle variabili d'ambiente, mai scritti qui)
#   DB_URL       opzionale, default: database locale linkr_db
#   DB_USERNAME  obbligatoria
#   DB_PASSWORD  opzionale (vuota se il Postgres locale non la richiede)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/linkr_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

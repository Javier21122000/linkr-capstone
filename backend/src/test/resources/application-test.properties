# Profilo "test": usa SOLO il database dedicato linkr_test_db.
# URL e nome atteso sono fissi e NON leggono LINKR_DB_URL / LINKR_DB_EXPECTED_NAME,
# cosi' una variabile globale non puo' puntare i test a linkr_db o a database di altri progetti.
spring.datasource.url=jdbc:postgresql://localhost:5432/linkr_test_db
# Solo utente e password arrivano dall'ambiente (LINKR_TEST_DB_* oppure, in alternativa, LINKR_DB_*).
spring.datasource.username=${LINKR_TEST_DB_USERNAME:${LINKR_DB_USERNAME}}
spring.datasource.password=${LINKR_TEST_DB_PASSWORD:${LINKR_DB_PASSWORD:}}

# La guardia controlla il nome PRIMA di Flyway (GuardedFlywayMigrationStrategy).
linkr.database.expected-name=linkr_test_db

spring.jpa.show-sql=false

# Segreto JWT casuale, diverso a ogni avvio del test: nessun segreto scritto nel repository.
linkr.jwt.secret=${random.uuid}${random.uuid}

# Cartella upload dei test: SEMPRE temporanea e diversa a ogni avvio, mai quella di sviluppo (~/.linkr/uploads).
# I test che salvano immagini la sostituiscono con una cartella propria che cancellano a fine test.
linkr.uploads.dir=${java.io.tmpdir}/linkr-test-uploads-${random.uuid}

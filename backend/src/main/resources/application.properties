spring.application.name=linkr

# PostgreSQL (valori letti dalle variabili d'ambiente, mai scritti qui).
# Le variabili hanno il prefisso LINKR_ per non confondersi con quelle di altri progetti.
#   LINKR_DB_URL       opzionale, default: database locale linkr_db
#   LINKR_DB_USERNAME  obbligatoria
#   LINKR_DB_PASSWORD  opzionale (vuota se il Postgres locale non la richiede)
spring.datasource.url=${LINKR_DB_URL:jdbc:postgresql://localhost:5432/linkr_db}
spring.datasource.username=${LINKR_DB_USERNAME}
spring.datasource.password=${LINKR_DB_PASSWORD:}

# Protezione: Flyway non migra se il database collegato non si chiama cosi' (vedi GuardedFlywayMigrationStrategy).
# In produzione, con un database dal nome diverso, impostare LINKR_DB_EXPECTED_NAME (vuoto = controllo disattivato).
linkr.database.expected-name=${LINKR_DB_EXPECTED_NAME:linkr_db}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
# Mai stack trace o messaggi interni nelle risposte di errore (devtools altrimenti li abilita)
server.error.include-stacktrace=never
server.error.include-message=never

# CORS: origini autorizzate (separate da virgola). Per il deploy impostare CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

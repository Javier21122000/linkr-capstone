spring.application.name=linkr

# PostgreSQL (valori letti dalle variabili d'ambiente, mai scritti qui).
# Le variabili hanno il prefisso LINKR_ per non confondersi con quelle di altri progetti.
#   LINKR_DB_URL       opzionale, default: database locale linkr_db
#   LINKR_DB_USERNAME  obbligatoria
#   LINKR_DB_PASSWORD  opzionale (vuota se il Postgres locale non la richiede)
spring.datasource.url=${LINKR_DB_URL:jdbc:postgresql://localhost:5432/linkr_db}
spring.datasource.username=${LINKR_DB_USERNAME}
spring.datasource.password=${LINKR_DB_PASSWORD:}

# Protezione: Flyway non migra se il database collegato non si chiama cosi' (vedi GuardedFlywayMigrationStrategy).
# In produzione, con un database dal nome diverso, impostare LINKR_DB_EXPECTED_NAME (vuoto = controllo disattivato).
linkr.database.expected-name=${LINKR_DB_EXPECTED_NAME:linkr_db}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
# Mai stack trace o messaggi interni nelle risposte di errore (devtools altrimenti li abilita)
server.error.include-stacktrace=never
server.error.include-message=never

# CORS: origini autorizzate (separate da virgola). Per il deploy impostare CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# JWT: il segreto (almeno 32 caratteri) e' OBBLIGATORIO e arriva dall'ambiente. Esempio per generarlo: openssl rand -base64 48
linkr.jwt.secret=${LINKR_JWT_SECRET}
linkr.jwt.issuer=linkr
linkr.jwt.expiration=${LINKR_JWT_EXPIRATION:2h}

# Upload immagini degli eventi (vedi docs/UPLOAD-IMMAGINI.md).
# Cartella ESTERNA al repository: variabile LINKR_UPLOAD_DIR, altrimenti ~/.linkr/uploads. Non va mai dentro il progetto.
linkr.uploads.dir=${LINKR_UPLOAD_DIR:${user.home}/.linkr/uploads}
# Upload tentati per utente (in memoria, si azzerano al riavvio)
linkr.uploads.max-per-hour=20
linkr.uploads.max-per-day=60
# Limiti del parser multipart: 5 MB per file, 6 MB per richiesta (il file piu' le intestazioni delle parti)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Se un upload supera i limiti, Tomcat scarta il resto della richiesta (fino a 16 MB) prima di chiudere la connessione:
# cosi' una foto troppo grande (es. 7-12 MB) riceve un 413 pulito invece di un errore di rete. Oltre 16 MB la connessione puo' essere chiusa.
server.tomcat.max-swallow-size=16MB
